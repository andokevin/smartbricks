# Base PostgreSQL 17 de SmartBricks.
# Port hôte 5435 : 5432, 5433 et 5434 sont déjà pris par d'autres projets sur cette machine.
services:
  db:
    image: postgres:17
    container_name: smartbricks_db
    environment:
      POSTGRES_USER: smartbricks
      POSTGRES_PASSWORD: smartbricks
      POSTGRES_DB: smartbricks
    ports: ["5435:5432"]
    volumes: [smartbricks_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbricks -d smartbricks"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smartbricks_pg:
